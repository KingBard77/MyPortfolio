# MyPortfolio - production deploy read by xxdeployer (xxdeployer myportfolio prod).
# KEY=VALUE only, committed, no secrets (AWS credentials stay in ~/.aws).
# Same behaviour as the old xxdeployer: sync build/ to the bucket with --delete, then rewrite index.html metadata.

BUILD_COMMAND=npm run build
BUILD_DIR=build
BUILD_CHECK=index.html

TARGET=s3
S3_BUCKET=www.badrulamin.com
S3_DELETE=true
S3_INDEX=index.html
CACHE_CONTROL=max-age=0,no-cache,no-store,must-revalidate
HEALTH_URL=https://www.badrulamin.com/
